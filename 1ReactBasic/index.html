<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basic</title>
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel CDN -->
    <!-- 
        Babel is used to compile JSX code into JavaScript that browsers can understand 
        Browswer က jsx ကို နားမလည်လို့ babel က compile လုပ်ပေးပြီး browser က နားလည်တဲ့ js code ကို ပြန်ပေးပါတယ်
     -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <h1>React Basic</h1>
    <p>Hello World</p>
    <div id="main"></div>
</body>

<script type="text/babel">
    // Browser မှာ Babel နဲ့ Compile လုပ်ချင်တဲ့အတွက်ကြောင့် type="text/babel" လို့ရေးပေးရတယ်။ အဲ့တာအရေးကြီးပါတယ်။
    // React Component ကို စတင်ဖန်တီးခြင်း။ အပေါ်မှာ id="main" ဆိုတဲ့ div ကို Control လုပ်မယ့် Component ဖြစ်ပါတယ်။
    const Main = () => {
        // react component မှာ return statement က အရေးကြီးပါတယ်။ ဘာကို ပြန်ပေးမလဲဆိုရင် html template ကို ပြန်ပေးရပါတယ်။ 
        // အဲ့ template ကို JSX လို့ခေါ်ပါတယ်။ JSX က JavaScript XML လို့ခေါ်တဲ့ syntax extension တစ်ခုဖြစ်ပြီး React component တွေကို ရေးသားဖန်တီးရာမှာ အသုံးပြုပါတယ်။
        // jsx မှာက HTML လို class မဟုတ်ပဲ className ဖြစ်သွားတယ်
        // jsx code တွေထဲမှာ single root element တစ်ခုပဲ ပါတယ်

        let name = "Thet Zaw Hein";
        let number = 20; // ဒီနေရာမှာ number ဆိုတာ Number Datatype ဖြစ်တယ် 
        // browser မှာ render လုပ်ပြီးရင်တော့ number က String datatype ဖြစ်သွားတယ်

        // class တစ်ခုကို Condition တစ်ခုပေါ်မှာ မူတည်ပြီး ရေးချင်တယ်ဆိုရင်
        let className = "my-class-name";
        // return ထဲမှာ className ဆိုတဲ့ data က အပေါ်က တန်ဖိုးကိုလိုက်ပြီး Dynamic ပြောင်းလဲသွားမှာဖြစ်ပါတယ် အောက်က div ထဲမှာတော့ "" မဟုတ်ပဲ Template Extraction {} နဲ့ရေးပေးရတာကို သတိထားပါ

        let clickHandler = (e) => {
            // alert('Hello World');
            console.log(e);
        }

        return (
            <div className={className}>
                <h1>Hello, {name}!</h1>
                <h1>Hello, {name.toUpperCase()}!</h1>
                <p>{number}</p>
                <p>{new Date().toDateString()}</p>
                <button onClick={clickHandler}>Click Me!</button>
                {/* Event တွေအကြောင်းသွားပါမယ် : Click Event */}
                {/* အပေါ်က {} ထဲက clickHandler မှာ () ကွင်းမပါတာဟာ Function Reference လို့ခေါ်ပါတယ် 
                () ကွင်းထည့်လိုက်ရင်တော့ click နှိပ်မှ Function အလုပ်လုပ်တာမျိုးမဟုတ်ပဲ Reload လုပ်တိုင်း အလုပ်လုပ်နေမှာဖြစ်ပါတယ် */}
            </div>
        )
    }

    let rootContainer = document.getElementById('main');
    // create react element
    let e = React.createElement;

    // create react root element
    let root = ReactDOM.createRoot(rootContainer);

    // render the react root - Browswer ပေါ်မှာ render လုပ်ခြင်း
    root.render(e(Main));
</script>

</html>
